# Dedicated LOCAL security-test stack. No hosted project is linked by this file.
project_id = "nirvana-catalog-security-test"
[api]
enabled = true
port = 56321
schemas = ["api"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 56322
shadow_port = 56320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = false
[storage]
enabled = true
file_size_limit = "10MiB"
[analytics]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = false
[edge_runtime]
enabled = false
