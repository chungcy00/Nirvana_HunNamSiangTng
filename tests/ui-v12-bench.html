<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>UI v1.2 浏览器布局验收</title><style>body{font-family:sans-serif;background:#eee;margin:0}iframe{display:block;border:0;background:white;margin:0 auto 24px}pre{padding:16px;white-space:pre-wrap}h2{padding:16px;font-size:16px}</style><pre id="results">正在测量</pre><div id="frames"></div><script>
const holder=document.getElementById('frames');
const routes=['/','/nirvana?category=2','/nirvana?category=4&view=list','/nirvana/products/item/w-family-lot','/nirvana/products/item/funeral-1-1','/contact','/yunnan-siantang'];
const params=new URLSearchParams(location.search),only=params.get('only'),widths=only?[Number(only)]:[390,768,1440];
for(const width of widths)for(const route of routes){const h=document.createElement('h2');h.textContent=width+'px '+route;holder.append(h);const frame=document.createElement('iframe');frame.width=String(width);frame.height='900';frame.title=h.textContent;frame.src='/tests/ui-v12-preview.html?route='+encodeURIComponent(route);holder.append(frame);}
const started=Date.now();const timer=setInterval(()=>{const rows=[...document.querySelectorAll('iframe')].map(f=>{const d=f.contentDocument,w=f.contentWindow;if(!d?.querySelector('main'))return{case:f.title,ready:false};return{case:f.title,ready:true,width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,offenders:[...d.querySelectorAll("main *")].filter(e=>e.getBoundingClientRect().right>d.documentElement.clientWidth+1).slice(0,5).map(e=>({tag:e.tagName,cls:e.className,right:Math.round(e.getBoundingClientRect().right)})),font:w.getComputedStyle(d.querySelector('h1')).fontFamily,photos:d.querySelectorAll('.fgp-card-funeral .fgp-image,.fgp-service-detail .fgp-gallery').length,mainHeading:d.querySelector('h1')?.textContent}});results.textContent=JSON.stringify(rows,null,2);if(rows.every(r=>r.ready)||Date.now()-started>30000)clearInterval(timer);},500);
</script></html>
